name: Build and Push Frontend

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zipleix/scrabble-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            PUBLIC_API_BASE_URL=https://api.scrabble.baptiste.zip
            VITE_API_BASE_URL=https://api.scrabble.baptiste.zip
            PUBLIC_VAPID_PUBLIC_KEY=BDHaIRh8cBC4h5uJdC8fMv-8qH8ygL4RJU41nwR55zI5QVMP4AOV_Adv7fVzLjUBh-WTQdw-gUrdK7OUt9ywOCI
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
