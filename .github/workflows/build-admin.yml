name: Build and Push Admin Dashboard

on:
  push:
    branches: [ "master" ]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/build-admin.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zipleix/scrabble-admin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          file: ./admin-dashboard/Dockerfile
          push: true
          build-args: |
            PUBLIC_API_BASE_URL=https://api.scrabble.baptiste.zip
            VITE_API_BASE_URL=https://api.scrabble.baptiste.zip
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest