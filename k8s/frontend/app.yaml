apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrabble-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrabble-frontend
  template:
    metadata:
      labels:
        app: scrabble-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/zipleix/scrabble-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: scrabble-frontend-svc
  namespace: default
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: scrabble-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrabble-frontend-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/target: 82.67.198.156
spec:
  ingressClassName: traefik
  rules:
  - host: scrabble.baptiste.zip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: scrabble-frontend-svc
            port:
              number: 3000
  tls:
  - hosts:
    - scrabble.baptiste.zip
    secretName: scrabble-baptiste-zip-tls
