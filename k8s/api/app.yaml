apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrabble-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrabble-api
  template:
    metadata:
      labels:
        app: scrabble-api
    spec:
      containers:
      - name: api
        image: ghcr.io/zipleix/scrabble-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - secretRef:
            name: scrabble-api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: scrabble-api-svc
  namespace: default
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: scrabble-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrabble-api-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/target: 82.67.198.156
spec:
  ingressClassName: traefik
  rules:
  - host: api.scrabble.baptiste.zip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: scrabble-api-svc
            port:
              number: 8080
  tls:
  - hosts:
    - api.scrabble.baptiste.zip
    secretName: api-scrabble-baptiste-zip-tls
